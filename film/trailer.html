<title>Pip and the Missing Glow: 15-second trailer</title>
<!--
  A 15-second square trailer for the film, drawn with code like the film itself. The film's own modules draw every
  frame of Pip's garden you see here; trailer.js adds the words, the cuts and the timing.
    trailer.html?t=3.5      one frame          trailer.html?play   plays in real time
    &lang=es                the Spanish cut
  Render it with:  node film/render.mjs --page trailer.html --out out/trailer-picture.mp4 --cues out/trailer-cues.json
-->
