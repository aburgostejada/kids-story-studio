<!doctype html>
<meta charset="utf-8">
<title>Pip lab</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:auto}</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="core.js"></script>
<script>window.PIP.LABS = {};</script>
<script src="world.js"></script>
<script src="cast.js"></script>
<script src="fx.js"></script>
<script src="lab-core.js"></script>
<script src="lab-world.js"></script>
<script src="lab-cast.js"></script>
<script src="lab-fx.js"></script>
<script>
// Motion-blur lab scenes for the host (comp.html and lab.html draw blur the same way): four bright cards cross a sharp, static dusk
// garden at about 80 px a frame. 'host-mblur' has grade.mblur only. 'host-mblur-cut' also names a composition, which changes at 1 s:
// the new one has other cards and another sky, so a blurred sub-frame that straddles the change must not carry the old one across.
// 'host-mblur' also compares sub-frame counts: 3 sub-frames before 1 s, 6 after (the same cards, the same shutter).
(() => {
const P = PIP;
const wrap = v => ((v % 400) + 400) % 400 - 200;           // cards leave the frame at |x| 200 units, far beyond the frame edge (about 174)
const garden = (cam, sky) => [
  { z: 1e6, screen: true, draw: c => { const g = c.createLinearGradient(0, 0, 0, P.H); g.addColorStop(0, sky[0]); g.addColorStop(1, sky[1]); c.fillStyle = g; c.fillRect(0, 0, P.W, P.H); } },
  { z: 1200, draw: c => P.card(c, k => { k.moveTo(-600, 40); k.lineTo(600, 40); k.lineTo(600, 400); k.lineTo(-600, 400); k.closePath(); }, P.lit([60, 88, 150], 0, 40, 1200), { lift: 2, edge: 0.25 }) },
  { z: 1100, draw: c => P.card(c, k => k.ellipse(-120, 40, 260, 26, 0, 0, P.TAU), P.lit([36, 70, 120], -120, 40, 1100), { lift: 2 }) },
];
const cards = (t, cols, ys, speed) => [0, 1, 2, 3].map(i => {
  const x = wrap(i * 150 + t * speed), y = ys[i], col = cols[i % cols.length];
  return { z: 400, draw: c => P.card(c, k => k.ellipse(x, y, 16, 9, 0, 0, P.TAU), P.lit(col, x, y, 400, 0.45), { lift: 1.5, edge: 0.35, tex: 0.2 }) };
});
const cam = { x: 0, y: 0, z: 0, f: 2400, focus: 400, ap: 0, roll: 0 };           // ap 0: nothing is depth-blurred, only motion
const amb = [0.3, 0.38, 0.65];
P.LABS['host-mblur'] = t => ({ cam, ambient: amb, lights: [], grade: { mblur: 0.6, mblurN: t < 1 ? 3 : 6 }, items: [...garden(cam, ['#0b1640', '#24356b']), ...cards(t, [[255, 190, 90], [255, 226, 150]], [-40, -90, -20, -120], 400)] });
P.LABS['host-mblur-cut'] = t => {
  const a = t < 1;
  return { cam, ambient: amb, lights: [], grade: { mblur: 0.6, cut: a ? 'a' : 'b' },
    items: [...garden(cam, a ? ['#0b1640', '#24356b'] : ['#2a1038', '#5a2f5c']), ...cards(t, a ? [[255, 190, 90], [255, 226, 150]] : [[90, 230, 200], [150, 255, 225]], a ? [-40, -90, -20, -120] : [-60, -110, -30, -130], 400)] };
};
})();
// Module-state labs: the scenes are built from the world and fx builders, whose per-frame state is set by each build and read by the
// items when they draw. 'host-state-cut' changes composition at 1 s (a lit garden before, a dark one after, other lights); the blur
// near the cut must not carry the other one's state into the frame. 'host-state-flicker' names a new cut at every instant, so every
// sub-frame but the centre one is rejected and the blurred frame must equal the unblurred one (a test of the rejection path).
(() => {
const P = PIP, WD = P.world, FX = P.fx;
const gardenCam = { x: 0, y: -60, z: 0, f: 2400, focus: 400, ap: 0, roll: 0 };
const labSt = (t, k) => ({ t, water: 0.55 * k, waterGlow: 0.6 * k, pond: 0.3 * k, hero: { climb: k, petal: k, flicker: 1, open: k },
  flower: i => ({ climb: k, petal: k * (0.6 + 0.4 * Math.sin(i * 2.3 + t)), flicker: 1, open: k }),
  leaf: { curl: 1, x: -900, y: -10, z: 2588, rot: 0.2, free: 0, lift: 0 }, pinStone: { x: -870, z: 2582, rot: 0.2 },
  dipper: { x: -98, y: 0, z: 384, rot: 0.1, held: false, water: 0 }, calm: 0, cam: gardenCam });
const garden = (t, k) => { const st = labSt(t, k);
  return { cam: gardenCam, ambient: k > 0.5 ? [0.30, 0.38, 0.65] : [0.16, 0.2, 0.42], lights: FX.lights(st),
    items: [...WD.sky(st), ...WD.hills(st), ...WD.ground(st, gardenCam), ...WD.channel(st), ...WD.flowers(st), ...WD.hero(st), ...WD.props(st)] }; };
P.LABS['host-state-cut'] = t => { const a = t < 1, sc = garden(t, a ? 1 : 0); sc.grade = { mblur: 0.6, cut: a ? 'lit' : 'dark' }; return sc; };
P.LABS['host-state-flicker'] = t => { const sc = garden(t, 0.5 + 0.5 * Math.sin(t * 40)); sc.grade = { mblur: 0.6, cut: Math.round(t * 1e6) }; return sc; };
})();
// Lab host: renders one module test scene PIP.LABS[name](t) -> scene. ?lab=name&t=s for the browser.
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), q = new URLSearchParams(location.search);
let LAB = q.get('lab');
// Motion blur is drawn exactly as comp.html draws it (see there): a scene's grade.mblur averages three sub-frames; ?mblur=0 turns it off.
const FPS = 30, MBLUR_ON = q.get('mblur') !== '0', LAB_DUR = 10;
const SUB = PIP.off(), SUBX = SUB.getContext('2d'), ACC = PIP.off(), ACCX = ACC.getContext('2d');
// grade.mblurN is how many sub-frames the shutter is averaged over: an integer from 3 to 8 (values outside clamp; anything that is not a number is 3).
const blurCount = v => { const n = Math.round(Number(v)); return Number.isNaN(n) ? 3 : Math.min(8, Math.max(3, n)); };
const fillBlack = c => { c.setTransform(1, 0, 0, 1, 0, 0); c.filter = 'none'; c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1; c.fillStyle = '#000'; c.fillRect(0, 0, PIP.W, PIP.H); };
// Motion blur as comp.html draws it. A scene's build sets the
// modules' per-frame state (world.js, fx.js), which its items read when they draw, so a scene is always DRAWN right after it is BUILT,
// with no other scene built in between: a sub-frame that is rejected is built, thrown away, and the centre scene is built again and drawn.
function paintFrame(t, sceneAt, dur) {
  const first = sceneAt(t), g = first.scene.grade || {}, shutter = MBLUR_ON ? PIP.clamp(Number(g.mblur) || 0) : 0;
  fillBlack(ctx);
  if (!(shutter > 0)) { PIP.renderScene(ctx, first.scene, t); PIP.grade(ctx, cv, t, g); return first.id; }   // the centre scene, built once and drawn at once
  // (the first build is only read for the grade: it is not drawn, so the sub-frames below build their own)
  fillBlack(ACCX);
  const N = blurCount(g.mblurN);                             // the centre frame's sub-frame count (its own grade decides)
  for (let j = 0; j < N; j++) {
    const tj = PIP.clamp(t + shutter / FPS * ((j + 0.5) / N - 0.5), 0, dur);
    const cand = sceneAt(tj), own = tj === t || (cand.id === first.id && (cand.scene.grade || {}).cut === g.cut);
    const use = own ? cand : sceneAt(t), at = own ? tj : t;   // a rejected candidate is dropped; the centre is rebuilt, then drawn
    fillBlack(SUBX); PIP.renderScene(SUBX, use.scene, at);
    ACCX.globalAlpha = 1 / (j + 1); ACCX.drawImage(SUB, 0, 0);   // running mean: after j + 1 frames each has weight 1 / (j + 1)
  }
  ACCX.globalAlpha = 1; fillBlack(ctx); ctx.drawImage(ACC, 0, 0);
  PIP.grade(ctx, cv, t, g);
  return first.id;
}
const labAt = t => ({ id: 0, scene: PIP.LABS[LAB](t) });
window.boot = async (name) => { if (name) LAB = name; if (!PIP.LABS[LAB]) throw new Error('no lab ' + LAB + '; have ' + Object.keys(PIP.LABS)); return { duration: LAB_DUR, shots: 1 }; };
window.renderAt = (t) => { paintFrame(t, labAt, LAB_DUR); };
if (LAB) window.addEventListener('load', async () => { await window.boot(); window.renderAt(Number(q.get('t') || 0)); });
</script>
