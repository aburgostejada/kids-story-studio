<!doctype html>
<meta charset="utf-8">
<title>Pip procedural</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:auto}</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="core.js"></script>
<script src="world.js"></script>
<script src="cast.js"></script>
<script src="fx.js"></script>
<script src="shots.js"></script>
<script src="act1.js"></script>
<script src="act2.js"></script>
<script src="act3.js"></script>
<script>
// Host page: boot() reports the film length; renderAt(t) paints frame t. Everything drawn is code (PIP.*).
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
// Motion blur (CONTRACT.md, "Motion blur"). A scene with grade.mblur = shutter (0..1 of a frame) is drawn as the average of its
// sub-frames spread across its shutter, each drawn without the grade, and then graded once. A sub-frame that falls in another shot, or
// whose grade.cut differs from the centre frame's, is replaced by the centre frame, so no blur ever crosses a cut. ?mblur=0 turns it off.
// grade.mblurN sets the sub-frame count (3 by default, up to 8) for fast moves that show separate copies at three.
// The sub-frames are pure functions of their own times, so the same t gives the same pixels in any order.
const FPS = 30, MBLUR_ON = new URLSearchParams(location.search).get('mblur') !== '0';
const SUB = PIP.off(), SUBX = SUB.getContext('2d'), ACC = PIP.off(), ACCX = ACC.getContext('2d');
// grade.mblurN is how many sub-frames the shutter is averaged over: an integer from 3 to 8 (values outside clamp; anything that is not a number is 3).
const blurCount = v => { const n = Math.round(Number(v)); return Number.isNaN(n) ? 3 : Math.min(8, Math.max(3, n)); };
const fillBlack = c => { c.setTransform(1, 0, 0, 1, 0, 0); c.filter = 'none'; c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1; c.fillStyle = '#000'; c.fillRect(0, 0, PIP.W, PIP.H); };
// sceneAt(t) -> { id, scene }: id names the shot (a sub-frame may only borrow the centre frame's shot). A scene's build sets the
// modules' per-frame state (world.js, fx.js), which its items read when they draw, so a scene is always DRAWN right after it is BUILT,
// with no other scene built in between: a sub-frame that is rejected is built, thrown away, and the centre scene is built again and drawn.
function paintFrame(t, sceneAt, dur) {
  const first = sceneAt(t), g = first.scene.grade || {}, shutter = MBLUR_ON ? PIP.clamp(Number(g.mblur) || 0) : 0;
  fillBlack(ctx);
  if (!(shutter > 0)) { PIP.renderScene(ctx, first.scene, t); PIP.grade(ctx, cv, t, g); return first.id; }   // the centre scene, built once and drawn at once
  // (the first build is only read for the grade: it is not drawn, so the sub-frames below build their own)
  fillBlack(ACCX);
  const N = blurCount(g.mblurN);                             // the centre frame's sub-frame count (its own grade decides)
  for (let j = 0; j < N; j++) {
    const tj = PIP.clamp(t + shutter / FPS * ((j + 0.5) / N - 0.5), 0, dur);
    const cand = sceneAt(tj), own = tj === t || (cand.id === first.id && (cand.scene.grade || {}).cut === g.cut);
    const use = own ? cand : sceneAt(t), at = own ? tj : t;   // a rejected candidate is dropped; the centre is rebuilt, then drawn
    fillBlack(SUBX); PIP.renderScene(SUBX, use.scene, at);
    ACCX.globalAlpha = 1 / (j + 1); ACCX.drawImage(SUB, 0, 0);   // running mean: after j + 1 frames each has weight 1 / (j + 1)
  }
  ACCX.globalAlpha = 1; fillBlack(ctx); ctx.drawImage(ACC, 0, 0);
  PIP.grade(ctx, cv, t, g);
  return first.id;
}
const filmAt = t => { const F = PIP.FILM; let k = 0, t0 = 0;
  while (k < F.shots.length - 1 && t >= t0 + F.shots[k].dur) { t0 += F.shots[k].dur; k++; }
  return { id: k, scene: F.shots[k].build(t - t0, t) }; };
window.boot = async () => ({ duration: PIP.FILM.duration, shots: PIP.FILM.shots.length });
window.renderAt = (t) => paintFrame(t, filmAt, PIP.FILM.duration);
// Preview: ?t=12.5 renders one frame; ?play plays in real time.
const q = new URLSearchParams(location.search);
if (q.has('t') || q.has('play')) window.addEventListener('load', async () => {
  await window.boot(); if (q.has('t')) return window.renderAt(Number(q.get('t')));
  const t0 = performance.now(); const loop = () => { window.renderAt(((performance.now() - t0) / 1000) % PIP.FILM.duration); requestAnimationFrame(loop); }; loop();
});
</script>
